<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="6" fill="#0055AA"/>
  <!-- Sausage (diagonal, center) -->
  <rect x="8" y="10" width="16" height="6" rx="3" fill="#C03A18" transform="rotate(-20 16 13)"/>
  <rect x="9" y="11" width="14" height="4" rx="2" fill="#D94E2A" transform="rotate(-20 16 13)"/>
  <!-- Grill marks -->
  <line x1="12" y1="10" x2="12" y2="16" stroke="#8C2508" stroke-width="0.8" transform="rotate(-20 16 13)"/>
  <line x1="16" y1="10" x2="16" y2="16" stroke="#8C2508" stroke-width="0.8" transform="rotate(-20 16 13)"/>
  <line x1="20" y1="10" x2="20" y2="16" stroke="#8C2508" stroke-width="0.8" transform="rotate(-20 16 13)"/>
  <!-- Fork (left, going up-left) -->
  <line x1="6" y1="6" x2="18" y2="24" stroke="#CCCCCC" stroke-width="1.8" stroke-linecap="round"/>
  <line x1="6" y1="6" x2="4" y2="9" stroke="#CCCCCC" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="6" y1="6" x2="9" y2="7" stroke="#CCCCCC" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="7" y1="8" x2="5" y2="11" stroke="#CCCCCC" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Sword (right, going up-right) -->
  <line x1="26" y1="6" x2="14" y2="24" stroke="#FFD700" stroke-width="1.8" stroke-linecap="round"/>
  <!-- Sword guard -->
  <rect x="23" y="9" width="6" height="1.5" rx="0.5" fill="#FFD700" transform="rotate(56 26 10)"/>
  <!-- Sword pommel -->
  <circle cx="26" cy="5.5" r="1.5" fill="#FFAA00"/>
</svg>
