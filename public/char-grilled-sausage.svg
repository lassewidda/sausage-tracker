<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 70" width="50" height="70">
  <!-- Grilled sausage - after, with grill marks and happy face -->
  <defs>
    <linearGradient id="gs" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CC4422"/>
      <stop offset="50%" stop-color="#AA3311"/>
      <stop offset="100%" stop-color="#882211"/>
    </linearGradient>
  </defs>
  <!-- Body -->
  <rect x="14" y="6" width="22" height="52" rx="11" fill="url(#gs)"/>
  <!-- Shine -->
  <rect x="18" y="10" width="6" height="12" rx="3" fill="#DD5533" opacity="0.5"/>
  <!-- Grill marks -->
  <rect x="14" y="20" width="22" height="3" rx="1" fill="#661100" opacity="0.4"/>
  <rect x="14" y="32" width="22" height="3" rx="1" fill="#661100" opacity="0.4"/>
  <rect x="14" y="44" width="22" height="3" rx="1" fill="#661100" opacity="0.4"/>
  <!-- Happy face -->
  <circle cx="21" cy="26" r="2" fill="#FFD700"/>
  <circle cx="29" cy="26" r="2" fill="#FFD700"/>
  <path d="M20 34 Q25 39 30 34" fill="none" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  <!-- Crown -->
  <polygon points="18,4 21,0 25,3 29,0 32,4" fill="#FFD700"/>
  <!-- Steam lines -->
  <path d="M16 2 Q13 -4 16 -8" fill="none" stroke="#FFF" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
  <path d="M34 2 Q37 -4 34 -8" fill="none" stroke="#FFF" stroke-width="1.5" opacity="0.3" stroke-linecap="round"/>
</svg>
