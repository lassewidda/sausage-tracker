<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 70" width="60" height="70">
  <!-- Hot dog in bun - center mascot -->
  <defs>
    <linearGradient id="bun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C66A"/>
      <stop offset="100%" stop-color="#C49A3C"/>
    </linearGradient>
    <linearGradient id="sau" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CC4422"/>
      <stop offset="100%" stop-color="#882211"/>
    </linearGradient>
  </defs>
  <!-- Bun back -->
  <rect x="8" y="14" width="44" height="46" rx="22" fill="#C49A3C"/>
  <!-- Sausage -->
  <rect x="16" y="10" width="28" height="50" rx="14" fill="url(#sau)"/>
  <rect x="20" y="14" width="8" height="14" rx="4" fill="#DD5533" opacity="0.4"/>
  <!-- Grill marks -->
  <rect x="16" y="28" width="28" height="3" rx="1" fill="#661100" opacity="0.35"/>
  <rect x="16" y="40" width="28" height="3" rx="1" fill="#661100" opacity="0.35"/>
  <!-- Bun front -->
  <rect x="6" y="14" width="18" height="46" rx="9" fill="url(#bun)"/>
  <rect x="36" y="14" width="18" height="46" rx="9" fill="url(#bun)"/>
  <!-- Sesame seeds -->
  <ellipse cx="12" cy="24" rx="2" ry="1.5" fill="#FFF4E0" opacity="0.6" transform="rotate(-10,12,24)"/>
  <ellipse cx="48" cy="30" rx="2" ry="1.5" fill="#FFF4E0" opacity="0.6" transform="rotate(10,48,30)"/>
  <!-- Mustard zigzag -->
  <path d="M22 20 L26 16 L30 20 L34 16 L38 20 L34 24 L30 20 L26 24 L22 20" fill="none" stroke="#FFD700" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Face -->
  <circle cx="26" cy="32" r="2" fill="#111"/>
  <circle cx="34" cy="32" r="2" fill="#111"/>
  <path d="M25 40 Q30 46 35 40" fill="none" stroke="#111" stroke-width="2" stroke-linecap="round"/>
  <!-- Sparkle -->
  <polygon points="50,8 52,12 56,12 53,15 54,19 50,17 46,19 47,15 44,12 48,12" fill="#FFD700" opacity="0.7"/>
</svg>
