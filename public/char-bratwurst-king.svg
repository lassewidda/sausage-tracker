<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 75" width="50" height="75">
  <!-- Bratwurst King - powered up sausage with mustard cape -->
  <defs>
    <linearGradient id="bk" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#CC4422"/>
      <stop offset="50%" stop-color="#AA3311"/>
      <stop offset="100%" stop-color="#882211"/>
    </linearGradient>
  </defs>
  <!-- Mustard cape -->
  <path d="M12 20 Q6 35 8 55 L14 58 Q12 40 14 25 Z" fill="#FFD700" opacity="0.7"/>
  <path d="M38 20 Q44 35 42 55 L36 58 Q38 40 36 25 Z" fill="#FFD700" opacity="0.7"/>
  <!-- Body -->
  <rect x="14" y="12" width="22" height="52" rx="11" fill="url(#bk)"/>
  <!-- Shine -->
  <rect x="18" y="16" width="6" height="12" rx="3" fill="#DD5533" opacity="0.5"/>
  <!-- Grill marks -->
  <rect x="14" y="28" width="22" height="3" rx="1" fill="#661100" opacity="0.4"/>
  <rect x="14" y="40" width="22" height="3" rx="1" fill="#661100" opacity="0.4"/>
  <!-- Arms holding fork -->
  <rect x="6" y="30" width="8" height="4" rx="2" fill="#AA3311"/>
  <rect x="36" y="30" width="8" height="4" rx="2" fill="#AA3311"/>
  <!-- Fork in right hand -->
  <rect x="42" y="18" width="3" height="20" rx="1" fill="#AAAAAA"/>
  <rect x="40" y="14" width="3" height="10" rx="1" fill="#CCCCCC"/>
  <rect x="44" y="14" width="3" height="10" rx="1" fill="#CCCCCC"/>
  <!-- Determined face -->
  <circle cx="21" cy="24" r="2" fill="#FFD700"/>
  <circle cx="29" cy="24" r="2" fill="#FFD700"/>
  <path d="M20 34 Q25 39 30 34" fill="none" stroke="#FFD700" stroke-width="2" stroke-linecap="round"/>
  <!-- Crown -->
  <polygon points="14,10 18,2 22,8 25,0 28,8 32,2 36,10" fill="#FFD700"/>
  <rect x="14" y="10" width="22" height="3" fill="#FFAA00"/>
  <!-- Sparkles -->
  <circle cx="8" cy="14" r="2" fill="#FFD700" opacity="0.5"/>
  <circle cx="42" cy="10" r="1.5" fill="#FFD700" opacity="0.4"/>
  <circle cx="6" cy="50" r="1.5" fill="#FF8800" opacity="0.3"/>
</svg>
